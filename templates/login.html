{% extends "base.html" %}
{% block title %}Вход — NSTU Meet{% endblock %}
{% block content %}
<div class="form-shell">
  <h1 class="h2 fw-bold">С возвращением</h1><p class="text-secondary">Войди, чтобы продолжить знакомиться.</p>
  <form method="post" class="mt-4">
    <label class="form-label">Логин</label><input class="form-control mb-3" name="username" required autocomplete="username">
    <label class="form-label">Пароль</label><input class="form-control mb-4" type="password" name="password" required autocomplete="current-password">
    <button class="btn btn-primary rounded-pill w-100 py-2">Войти</button>
  </form>
  <p class="mt-3 text-secondary">Нет аккаунта? <a href="{{ url_for('register') }}">Создай анкету</a>.</p>
</div>
{% endblock %}
